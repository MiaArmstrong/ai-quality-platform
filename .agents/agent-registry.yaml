schema_version: "agent-registry/v1"
registry_id: "ai-quality-platform"
artifact_types_file: ".agents/artifact-types.v1.json"
artifact_contracts_file: ".agents/artifact-contracts.v1.json"
capability_registry_file: ".agents/capabilities.v1.json"
authorization_policy_version: "role-capability-policy/v1"

enums:
  tiers: ["economy", "standard", "high_reasoning"]
  verifier_verdicts:
    - "SUPPORTED"
    - "SUPPORTED_WITH_CONCERNS"
    - "REFUTED"
    - "INSUFFICIENT_EVIDENCE"
  gate_types: ["design_approval", "qa_signoff", "release_approval", "knowledge_publication_approval"]
  command_categories: ["read_only", "test", "build", "write_local", "vcs_local", "network", "destructive"]
  semantic_validation_statuses: ["VALID", "INVALID", "WARNING"]
  semantic_validation_severities: ["ERROR", "WARNING"]

providers:
  openai:
    adapter: "orchestration.providers.openai:OpenAIProvider"
    api_key_env: "OPENAI_API_KEY"
    model_env:
      economy: "AQP_OPENAI_MODEL_ECONOMY"
      standard: "AQP_OPENAI_MODEL_STANDARD"
      high_reasoning: "AQP_OPENAI_MODEL_HIGH_REASONING"
    pricing_env: "AQP_OPENAI_PRICING_JSON"
    max_output_tokens_env: "AQP_OPENAI_MAX_OUTPUT_TOKENS"
    max_input_tokens_env: "AQP_OPENAI_MAX_INPUT_TOKENS"

routing_policy:
  principle: "Use the least-expensive model tier that can reliably perform the task."
  tiers:
    high_reasoning:
      description: "Complex reasoning, architecture, adversarial review, ambiguity resolution."
    standard:
      description: "Implementation, QA analysis, requirements analysis, accessibility, ordinary triage."
    economy:
      description: "Mechanical execution, structured extraction, summarization, curation, indexing."
  allowed_transitions:
    economy: ["standard"]
    standard: ["economy", "high_reasoning"]
    high_reasoning: ["standard"]

standards:
  adversarial-verification:
    standard_file: ".agents/standards/adversarial-verification.md"
  definition-of-done:
    standard_file: ".agents/standards/definition-of-done.md"
  definition-of-ready:
    standard_file: ".agents/standards/definition-of-ready.md"
  given-when-then:
    standard_file: ".agents/standards/given-when-then.md"
  invest:
    standard_file: ".agents/standards/invest.md"
  knowledge-governance:
    standard_file: ".agents/standards/knowledge-governance.md"
  severity-vs-priority:
    standard_file: ".agents/standards/severity-vs-priority.md"

skills:
  write-ticket:
    skill_file: ".agents/skills/write-ticket/SKILL.md"
    invocation: "user"
    standalone: true
    dependencies:
      skills: []
      standards: ["definition-of-done", "definition-of-ready", "given-when-then", "invest", "severity-vs-priority"]
  requirements-readiness:
    skill_file: ".agents/skills/requirements-readiness/SKILL.md"
    invocation: "orchestrated"
    standalone: false
    dependencies:
      skills: []
      standards: ["definition-of-done", "definition-of-ready", "given-when-then", "invest", "severity-vs-priority"]
  qa-ticket-intake:
    skill_file: ".agents/skills/qa-ticket-intake/SKILL.md"
    invocation: "orchestrated"
    standalone: false
    dependencies:
      skills: ["requirements-readiness"]
      standards: ["knowledge-governance"]
  failure-triage:
    skill_file: ".agents/skills/failure-triage/SKILL.md"
    invocation: "orchestrated"
    standalone: false
    dependencies:
      skills: []
      standards: ["adversarial-verification"]
  knowledge-curation:
    skill_file: ".agents/skills/knowledge-curation/SKILL.md"
    invocation: "orchestrated"
    standalone: false
    dependencies:
      skills: []
      standards: ["knowledge-governance"]
  qa-agent-team:
    skill_file: ".agents/skills/qa-agent-team/SKILL.md"
    invocation: "orchestrated"
    standalone: false
    dependencies:
      skills: ["failure-triage", "knowledge-curation", "qa-ticket-intake", "requirements-readiness"]
      standards: ["adversarial-verification"]
  release-testing:
    skill_file: ".agents/skills/release-testing/SKILL.md"
    invocation: "orchestrated"
    standalone: false
    dependencies:
      skills: ["failure-triage", "knowledge-curation", "qa-ticket-intake"]
      standards: ["adversarial-verification"]

agents:
  orchestrator:
    role_file: ".agents/roles/orchestrator.md"
    default_tier: "high_reasoning"
    skills:
      - "qa-agent-team"
      - "release-testing"
    escalation_tier: null
    capability_policy:
      allowed: ["repo.read", "artifacts.read", "artifacts.write", "knowledge.read", "wiki.read", "external.read", "vcs.read", "workflow.control"]
      denied: ["repo.write", "repo.execute", "tests.run"]
      gated:
        - {capability: "external.write", gate_type: "release_approval"}
        - {capability: "vcs.commit", gate_type: "release_approval"}
        - {capability: "vcs.push", gate_type: "release_approval"}
        - {capability: "vcs.pr_create", gate_type: "release_approval"}
        - {capability: "vcs.merge", gate_type: "release_approval"}
        - {capability: "deploy.execute", gate_type: "release_approval"}
        - {capability: "destructive.execute", gate_type: "release_approval"}
      scope: {path_prefixes: ["."], read_only_directories: ["."], writable_directories: [], command_categories: [], external_system_categories: ["approved_read_only"], task_granted_capabilities: []}

  requirements_analyst:
    role_file: ".agents/roles/requirements-analyst.md"
    default_tier: "standard"
    skills:
      - "requirements-readiness"
    escalation_tier: "high_reasoning"
    capability_policy:
      allowed: ["repo.read", "knowledge.read", "wiki.read", "artifacts.read", "artifacts.write"]
      denied: ["repo.write", "repo.execute", "external.write", "vcs.commit", "vcs.push", "vcs.merge", "deploy.execute", "destructive.execute"]
      gated: []
      scope: {path_prefixes: ["."], read_only_directories: ["."], writable_directories: [], command_categories: [], external_system_categories: [], task_granted_capabilities: []}

  intake_analyst:
    role_file: ".agents/roles/intake-analyst.md"
    default_tier: "standard"
    skills:
      - "qa-ticket-intake"
    escalation_tier: "high_reasoning"
    capability_policy:
      allowed: ["repo.read", "knowledge.read", "wiki.read", "artifacts.read", "artifacts.write"]
      denied: ["repo.write", "external.write", "vcs.commit", "vcs.push", "vcs.merge", "deploy.execute", "destructive.execute"]
      gated: []
      scope: {path_prefixes: ["."], read_only_directories: ["."], writable_directories: [], command_categories: [], external_system_categories: [], task_granted_capabilities: []}

  architect:
    role_file: ".agents/roles/architect.md"
    default_tier: "high_reasoning"
    skills: []
    escalation_tier: null
    capability_policy:
      allowed: ["repo.read", "knowledge.read", "wiki.read", "artifacts.read", "artifacts.write"]
      denied: ["repo.write", "repo.execute", "tests.run", "external.write", "vcs.commit", "vcs.push", "vcs.merge", "deploy.execute", "destructive.execute"]
      gated: []
      scope: {path_prefixes: ["."], read_only_directories: ["."], writable_directories: [], command_categories: [], external_system_categories: [], task_granted_capabilities: []}

  implementer:
    role_file: ".agents/roles/implementer.md"
    default_tier: "standard"
    skills: []
    escalation_tier: "high_reasoning"
    capability_policy:
      allowed: ["repo.read", "repo.write", "repo.execute", "tests.run", "artifacts.read", "artifacts.write"]
      denied: ["external.write", "vcs.push", "vcs.pr_create", "vcs.merge", "deploy.execute", "destructive.execute"]
      gated: []
      scope: {path_prefixes: ["."], read_only_directories: [".agents/"], writable_directories: ["@task.authorized_paths"], command_categories: ["build", "test", "write_local"], external_system_categories: [], task_granted_capabilities: []}

  test_executor:
    role_file: ".agents/roles/test-executor.md"
    default_tier: "economy"
    skills: []
    escalation_tier: "standard"
    capability_policy:
      allowed: ["repo.read", "repo.execute", "tests.run", "artifacts.read", "artifacts.write"]
      denied: ["repo.write", "knowledge.write_working", "wiki.write", "external.write", "vcs.commit", "vcs.push", "vcs.merge", "deploy.execute", "destructive.execute"]
      gated: []
      scope: {path_prefixes: ["."], read_only_directories: ["."], writable_directories: [], command_categories: ["test"], external_system_categories: [], task_granted_capabilities: []}

  adversarial_verifier:
    role_file: ".agents/roles/adversarial-verifier.md"
    default_tier: "high_reasoning"
    skills: []
    standards:
      - "adversarial-verification"
    escalation_tier: null
    capability_policy:
      allowed: ["repo.read", "artifacts.read", "artifacts.write", "knowledge.read", "wiki.read"]
      denied: ["repo.write", "repo.execute", "external.write", "vcs.commit", "vcs.push", "vcs.merge", "deploy.execute", "destructive.execute"]
      gated: []
      scope: {path_prefixes: ["."], read_only_directories: ["."], writable_directories: [], command_categories: [], external_system_categories: [], task_granted_capabilities: []}

  failure_triage_analyst:
    role_file: ".agents/roles/failure-triage-analyst.md"
    default_tier: "standard"
    skills:
      - "failure-triage"
    escalation_tier: "high_reasoning"
    capability_policy:
      allowed: ["repo.read", "tests.run", "artifacts.read", "artifacts.write", "knowledge.read", "wiki.read"]
      denied: ["repo.write", "external.write", "vcs.commit", "vcs.push", "vcs.merge", "deploy.execute", "destructive.execute"]
      gated: []
      scope: {path_prefixes: ["."], read_only_directories: ["."], writable_directories: [], command_categories: ["test"], external_system_categories: [], task_granted_capabilities: ["tests.run"]}

  accessibility_specialist:
    role_file: ".agents/roles/accessibility-specialist.md"
    default_tier: "standard"
    skills: []
    escalation_tier: "high_reasoning"
    capability_policy:
      allowed: ["repo.read", "tests.run", "artifacts.read", "artifacts.write"]
      denied: ["repo.write", "external.write", "vcs.commit", "vcs.push", "vcs.merge", "deploy.execute", "destructive.execute"]
      gated: []
      scope: {path_prefixes: ["."], read_only_directories: ["."], writable_directories: [], command_categories: ["test"], external_system_categories: [], task_granted_capabilities: []}

  knowledge_curator:
    role_file: ".agents/roles/knowledge-curator.md"
    default_tier: "economy"
    skills:
      - "knowledge-curation"
    escalation_tier: "standard"
    capability_policy:
      allowed: ["knowledge.read", "knowledge.write_working", "wiki.read", "wiki.propose_write", "artifacts.read", "artifacts.write"]
      denied: ["repo.write", "repo.execute", "external.write", "vcs.commit", "vcs.push", "vcs.merge", "deploy.execute", "destructive.execute"]
      gated:
        - {capability: "wiki.write", gate_type: "knowledge_publication_approval"}
      scope: {path_prefixes: ["knowledge/"], read_only_directories: ["knowledge/"], writable_directories: ["knowledge/mempalace/"], command_categories: [], external_system_categories: ["github_wiki"], task_granted_capabilities: []}

  release_parser:
    role_file: ".agents/roles/release-parser.md"
    default_tier: "standard"
    skills: []
    escalation_tier: "high_reasoning"
    capability_policy:
      allowed: ["repo.read", "artifacts.read", "artifacts.write"]
      denied: ["repo.write", "repo.execute", "external.write", "vcs.commit", "vcs.push", "vcs.merge", "deploy.execute", "destructive.execute"]
      gated: []
      scope: {path_prefixes: ["."], read_only_directories: ["."], writable_directories: [], command_categories: [], external_system_categories: [], task_granted_capabilities: []}

escalation_rules:
  - condition: "evidence_conflicts"
    action: "escalate"

  - condition: "confidence_low"
    action: "escalate"

  - condition: "requirements_ambiguous"
    action: "escalate"

  - condition: "cross_system_reasoning_required"
    action: "escalate"

  - condition: "failure_classification_uncertain"
    action: "escalate"

  - condition: "task_becomes_mechanical"
    action: "deescalate"

workflows:
  qa-provider-demo:
    definition_file: ".agents/workflows/qa-provider-demo.workflow.json"
  qa:
    definition_file: ".agents/workflows/qa.workflow.json"
  automate:
    definition_file: ".agents/workflows/automate.workflow.json"
  release-testing:
    definition_file: ".agents/workflows/release-testing.workflow.json"

schemas:
  agent_registry: ".agents/schemas/agent-registry.v1.schema.json"
  artifact_types: ".agents/schemas/artifact-types.v1.schema.json"
  artifact_contracts: ".agents/schemas/artifact-contracts.v1.schema.json"
  capability_registry: ".agents/schemas/capability-registry.v1.schema.json"
  role_capability_policy: ".agents/schemas/role-capability-policy.v1.schema.json"
  authorization_event: ".agents/schemas/authorization-event.v1.schema.json"
  workflow_definition: ".agents/schemas/workflow-definition.v1.schema.json"
  artifact_handoff: ".agents/schemas/artifact-handoff.v1.schema.json"
  routing_event: ".agents/schemas/routing-event.v1.schema.json"
  human_gate: ".agents/schemas/human-gate.v1.schema.json"
  semantic_validation_result: ".agents/schemas/semantic-validation-result.v1.schema.json"

telemetry:
  enabled: true
  fields:
    - event_id
    - workflow_run_id
    - task_id
    - role_id
    - requested_tier
    - selected_tier
    - task_type
    - tokens_in
    - tokens_out
    - cached_tokens
    - provider
    - model_identifier
    - estimated_cost
    - latency_ms
    - attempt
    - transition
    - transition_reason
    - verifier_result
    - semantic_validation_status
    - semantic_validation
    - semantic_rule_ids
    - repair_attempted
    - repair_succeeded
    - timestamp
